<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRISC Grade Checker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 70px auto; padding: 0 16px; }
    input { padding: 9px; width: 100px; }
    button { padding: 9px 14px; }
    #result { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Grade Checker</h1>
  <p>Enter a mark between 0 and 100.</p>
  <input id="marks" type="number" min="0" max="100" placeholder="Marks">
  <button id="checkButton">Check grade</button>
  <p id="result"></p>
  <p><a href="../../index.html">Back to Study Tracker</a></p>
  <script src="grade-checker.js"></script>
</body>
</html>
