<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRISC Study Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">BRISC Workshop 02</p>
    <h1>Study Tracker</h1>
    <p>Type a study task and add it to your list.</p>
    <div class="entry">
      <input id="task" type="text" placeholder="e.g. Practice Git commands">
      <button id="addButton">Add task</button>
    </div>
    <ul id="taskList"></ul>
    <p id="counter">0 tasks added</p>
    <p><a href="features/grade-checker/index.html">
  Open Grade Checker</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
